<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小装置 · 控制台</title>
<style>
body{margin:0;background:#0e1211;color:#6cdac9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px;padding:30px;text-align:center}
.s{color:#8e8e93;font-size:0.9em;line-height:1.6; letter-spacing: 0.5px;}
button{background:transparent;color:#ff7b74;border:1px solid #ff7b74;border-radius:12px;padding:12px 24px;font-size:.9em;font-family:inherit; cursor:pointer; transition:0.3s;}
button:active{background:#ff7b74;color:#0e1211;}
.loader {width: 40px; aspect-ratio: 1; --c: no-repeat radial-gradient(farthest-side,#6cdac9 92%,#0000); background: var(--c) 50% 0, var(--c) 50% 100%, var(--c) 100% 50%, var(--c) 0 50%; background-size: 10px 10px; animation: l18 1s infinite; position: relative;}
.loader::before {content:""; position: absolute; inset:0; margin: 3px; background: repeating-conic-gradient(#0000 0 35deg,#ff7b74 0 90deg); -webkit-mask: radial-gradient(farthest-side,#0000 calc(100% - 3px),#000 0); border-radius: 50%; animation: l18 1.5s infinite reverse;}
@keyframes l18 {to{transform: rotate(1turn)}}
.brand { font-size: 1.2em; font-weight: bold; color: #6cdac9; margin-bottom: 10px; text-shadow: 0 0 10px rgba(108,218,201,0.3); }
.red-dot { color: #ff7b74; }
</style>
</head>
<body>
<div class="brand">NYAlives<span class="red-dot">.</span>Loader</div>
<div class="loader" id="spinner"></div>
<div class="s" id="msg">正在接入通道…</div>
<button id="retry" style="display:none">重新连接</button>
<script>
var SRC = 'https://raw.githubusercontent.com/Suuuxing/web-demo/main/index.html';
function load(){
  var m = document.getElementById('msg'), r = document.getElementById('retry'), s = document.getElementById('spinner');
  m.innerHTML = '正在接入通道<span class="red-dot">...</span>';
  r.style.display = 'none';
  s.style.display = 'block';
  fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
    .then(function(t){
      if (t.indexOf('<html') < 0 && t.indexOf('<!DOCTYPE') < 0) throw new Error('数据格式异常');
      document.open(); document.write(t); document.close();
    })
    .catch(function(e){
      s.style.display = 'none';
      m.innerHTML = '连接中断<br><span style="font-size:0.8em;color:#ff7b74">' + ((e && e.message) || e) + '</span>';
      r.style.display = 'inline-block';
    });
}
document.getElementById('retry').addEventListener('click', load);
setTimeout(load, 500);
</script>
</body>
</html>
