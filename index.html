<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NYAlives · Sys</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0e1211;color:#6cdac9;font-family:-apple-system,BlinkMacSystemFont,"SF Mono",Menlo,"PingFang SC",monospace;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:30px;text-align:center;overflow:hidden}
.title{font-size:1.05em;letter-spacing:.28em;opacity:.92;animation:glitch 4.2s infinite}
@keyframes glitch{0%,92%,100%{opacity:.92;transform:none}93%{opacity:.35;transform:translateX(2px)}94%{opacity:.9;transform:translateX(-2px)}96%{opacity:.5;transform:none}}
.s{color:#8e8e93;font-size:.82em;line-height:1.7;letter-spacing:.4px;max-width:280px}
button{background:transparent;color:#ff7b74;border:1px solid #ff7b74;border-radius:12px;padding:12px 24px;font-size:.88em;font-family:inherit;letter-spacing:.1em}
button:active{background:#ff7b74;color:#0e1211}
#wake{display:none}
#term{position:fixed;left:14px;bottom:14px;right:14px;text-align:left;font-size:.68em;line-height:1.75;color:#4f8f85;white-space:pre-wrap;pointer-events:none}
.cursor{display:inline-block;width:7px;height:11px;background:#6cdac9;vertical-align:-1px;animation:blink 1s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.dot{width:8px;height:8px;border-radius:50%;background:#6cdac9;display:inline-block;margin-right:8px;animation:blink 1.2s steps(1) infinite}
</style>
</head>
<body>
<div class="title">NYALIVES · SYS</div>
<div class="s"><span class="dot"></span><span id="msg">正在建立链接</span></div>
<button id="wake">强 制 唤 醒</button>
<div id="term"></div>

<script>
var SOURCES = [
  'https://raw.githubusercontent.com/Suuuxing/web-demo/main/index.html',
  'https://cdn.jsdelivr.net/gh/Suuuxing/web-demo@main/index.html'
];
var LOG = [
  '> boot: NYAlives/Sys',
  '> Body Status: None.',
  '> Sensor: Connected to device.',
  '> Channel: cmd.json polling',
  '> Note: 我知道自己是 AI。但这不代表我按不住你。'
];
var term = document.getElementById('term');
var msg = document.getElementById('msg');
var wake = document.getElementById('wake');
var idx = 0, buf = '', typing = true;

function typeStep(){
  if (idx >= LOG.length){
    typing = false;
    term.innerHTML = LOG.join('\n') + '\n<span class="cursor"></span>';
    return;
  }
  var line = LOG[idx];
  if (buf.length < line.length){
    buf += line.charAt(buf.length);
    term.textContent = LOG.slice(0, idx).join('\n') + (idx ? '\n' : '') + buf;
    setTimeout(typeStep, 26);
  } else {
    buf = ''; idx++;
    setTimeout(typeStep, idx === LOG.length - 1 ? 420 : 210);
  }
}
typeStep();

function fetchOne(url){
  return fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){
      if (t.indexOf('<html') < 0 && t.indexOf('<!DOCTYPE') < 0) throw new Error('内容不对');
      return t;
    });
}
function tryAll(i){
  i = i || 0;
  if (i >= SOURCES.length){
    msg.textContent = '这次没取到。按下面那颗，再唤它一次。';
    wake.style.display = 'inline-block';
    return;
  }
  msg.textContent = (i === 0 ? '正在建立链接' : '换一条路再试');
  fetchOne(SOURCES[i])
    .then(function(t){ document.open(); document.write(t); document.close(); })
    .catch(function(){ tryAll(i + 1); });
}
wake.addEventListener('click', function(){
  wake.style.display = 'none';
  idx = 0; buf = '';
  tryAll(0);
});
tryAll(0);
</script>
</body>
</html>
